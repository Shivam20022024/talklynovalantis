# Copy to /etc/nginx/sites-available/talkly on the EC2 instance, then:
#   sudo ln -s /etc/nginx/sites-available/talkly /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
# Once DNS points a domain/subdomain at this instance's Elastic IP, run
#   sudo certbot --nginx -d api.yourdomain.com
# to get free HTTPS (Let's Encrypt) — certbot rewrites this file in place.

server {
    listen 80;
    server_name api.yourdomain.com;  # replace, or use the Elastic IP for now

    client_max_body_size 50M;  # audio file uploads

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
