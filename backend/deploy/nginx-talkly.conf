# Covers the whole stack - frontend (Next.js container, port 3000) on the
# bare domain + www, backend (FastAPI container, port 8000) on the api.
# subdomain. Copy to /etc/nginx/sites-available/talkly on the EC2 instance,
# replace yourdomain.com everywhere below with your real domain, then:
#   sudo ln -s /etc/nginx/sites-available/talkly /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
# Once DNS points yourdomain.com, www.yourdomain.com AND api.yourdomain.com
# at this instance's Elastic IP, run (one combined cert for all three):
#   sudo certbot --nginx -d yourdomain.com -d www.yourdomain.com -d api.yourdomain.com
# to get free HTTPS (Let's Encrypt) — certbot rewrites this file in place.

server {
    listen 80;
    server_name api.yourdomain.com;  # backend (FastAPI) - Razorpay's webhook points here

    client_max_body_size 50M;  # audio file uploads

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;

        # Live calls hold this open for the whole call duration - needed for
        # the /stream websocket (Plivo audio <-> OpenAI Realtime) to survive.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com;  # frontend (Next.js)

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
